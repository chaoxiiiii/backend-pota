<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Municipal Coordinator — eSaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">




<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>




<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    background:var(--cream);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:2100;
  }




  .topbar-left{ display:flex; align-items:center; gap:16px; }




  .hamburger{
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }




  .hamburger span{
    display:block;
    width:26px;
    height:3px;
    background:var(--ink);
    border-radius:2px;
  }




  .logos{ display:flex; align-items:center; gap:10px; }
  .seal{ width:44px; height:44px; }




  .brand-word{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:28px;
    color:var(--green);
    margin-left:-6px;
  }




  .brand-logo svg{ width:60px; height:50px; }




  .topbar-right{ display:flex; align-items:center; gap:18px; }




  .bell-wrap{
    position:relative;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }




  .bell-wrap svg{ width:18px; height:18px; fill:#fff; }




  .bell-dot{
    position:absolute;
    top:2px;
    right:2px;
    width:9px;
    height:9px;
    background:#C0392B;
    border-radius:50%;
    border:2px solid var(--cream);
  }




  .user-info{ display:flex; align-items:center; gap:10px; }
  .user-text{ text-align:right; line-height:1.25; }
  .user-name{ font-size:14px; font-weight:700; color:var(--ink); }
  .user-role{ font-size:12px; font-weight:600; color:var(--gold); }




  .avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#4a4a4a;
    display:flex;
    align-items:center;
    justify-content:center;
  }




  .avatar svg{ width:20px; height:20px; fill:#fff; }




  .layout{ display:flex; min-height:calc(100vh - 73px); }




  /* SIDEBAR STYLES */
  .sidebar{
    width:230px;
    background:var(--green);
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:22px 0;
    flex-shrink:0;
    position:fixed;
    top:73px;
    left:-230px;
    bottom:0;
    z-index:2000;
    transition:left .28s ease;
  }




  .sidebar.open{ left:0; }




  .nav-list{ display:flex; flex-direction:column; gap:2px; }




  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 24px;
    color:#fff;
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    background:transparent;
    border:none;
    width:100%;
    text-align:left;
  }




  .nav-item svg{ width:19px; height:19px; fill:#fff; flex-shrink:0; }
  .nav-item:hover{ background:rgba(255,255,255,0.08); }
  .nav-item.active{ background:var(--green-dark); font-weight:700; }




  .signout{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 24px;
    color:#fff;
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
  }




  .signout svg{ width:18px; height:18px; fill:#fff; }
  .signout:hover{ opacity:0.8; }




  .main{
    flex:1;
    padding:36px 40px;
    min-width:0;
  }




  .view{ display:none; }
  .view.active-view{ display:block; }




  .main-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:22px;
  }




  .main-header h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:36px;
    color:var(--green);
    letter-spacing:0.02em;
    margin:0;
  }




  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px 28px;
  }




  /* MAP DESIGN */
  #map{
    width:100%;
    height:360px;
    border-radius:8px;
    border:1px solid var(--border);
  }




  /* SEARCH & FILTER BAR */
  .search-row{ display:flex; gap:10px; align-items:center; }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:8px;
    padding:8px 14px;
    min-width:260px;
  }
  .search-box svg{ width:16px; height:16px; fill:none; stroke:var(--ink); stroke-width:2; }
  .search-box input{ border:none; outline:none; font-size:14px; width:100%; background:transparent; }




  /* TAB BUTTONS (SUMMARY / VIEW INDIVIDUAL / APPROVED / PENDING) */
  .tab-buttons-row{
    display:flex;
    gap:16px;
    margin-bottom:24px;
    align-items:center;
  }




  .tab-btn{
    padding:12px 24px;
    border:1.5px solid var(--ink);
    border-radius:8px;
    background:#EFEAE0;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    transition:all 0.2s ease;
  }




  .tab-btn:hover{ background:#DEDDDC; }
  .tab-btn.active{
    background:#C4C3C2;
    border-color:var(--ink);
  }




  /* SUMMARY TAB CONTENT DESIGN */
  .summary-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:24px;
  }




  .summary-left-box, .summary-right-card{
    background:#fff;
    border:1px solid #D0D0D0;
    border-radius:8px;
    padding:20px;
  }




  .summary-stat-chips{
    display:flex;
    gap:10px;
    margin:14px 0 20px;
    flex-wrap:wrap;
  }




  .stat-chip{
    padding:10px 14px;
    border-radius:8px;
    text-align:center;
    font-size:12px;
    font-weight:700;
    min-width:70px;
  }




  .stat-chip.gray{ background:#F2EFE9; border:1px solid #CCC; color:#333; }
  .stat-chip.black{ background:#000; color:#fff; }
  .stat-chip.green{ background:#0B823A; color:#fff; }
  .stat-chip.gold{ background:#D69E3D; color:#fff; }
  .stat-chip.red{ background:#B82218; color:#fff; }




  .stat-chip span{ display:block; font-size:14px; margin-top:2px; }




  .placeholder-line{
    height:24px;
    background:#F2EFE9;
    border-radius:4px;
    margin-bottom:10px;
  }




  .top-commodity-body{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-top:12px;
  }




  .top-commodity-img{
    width:120px;
    height:80px;
    background:#D6E5B3;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }




  /* TABLE COMMON DESIGN */
  table{ width:100%; border-collapse:separate; border-spacing:0; }
  thead tr{ background:#DEDDDC; }
  thead th{
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#222;
    padding:14px 10px;
  }
  thead th:first-child{ border-top-left-radius:8px; border-bottom-left-radius:8px; }
  thead th:last-child{ border-top-right-radius:8px; border-bottom-right-radius:8px; }




  tbody td{
    padding:14px 8px;
    font-size:13.5px;
    text-align:center;
    vertical-align:middle;
  }




  .pill{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    background:#EEEEEE;
    font-size:12.5px;
    color:#222;
    white-space:nowrap;
  }




  .status-pill{
    display:inline-block;
    padding:6px 20px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    color:#fff;
  }




  .status-pill.confirmed, .status-pill.approved, .status-pill.harvested{ background:#118308; }
  .status-pill.submitted, .status-pill.mediating{ background:#E5A510; }
  .status-pill.planted{ background:#E06030; }
  .status-pill.pending{ background:#C48D53; }




  /* REMARKS / NOTES SECTION */
  .notes-row{
    display:flex;
    gap:24px;
    align-items:flex-end;
    margin-top:24px;
    padding-top:16px;
    border-top:1px solid #E0E0E0;
  }




  .notes-field{ flex:1; }
  .notes-field label{ display:block; font-size:14px; font-weight:700; margin-bottom:8px; color:var(--ink); }




  .btn-outline-report{
    appearance:none;
    border:1.5px solid #5A6B52;
    background:#EFEAE0;
    color:#333;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:10px 24px;
    border-radius:8px;
    cursor:pointer;
    transition:all .2s ease;
  }




  .btn-outline-report:hover:not(:disabled){ background:#DEDDDC; }




  .detail-actions-row{
    display:flex;
    justify-content:flex-end;
    gap:16px;
    margin-top:24px;
  }




  .flag-btn.active{ background:#C83232; border-color:#C83232; color:#fff; }
  .approve-btn.active{ background:#5A7365; border-color:#5A7365; color:#fff; }




  /* MODAL OVERLAY */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(30,35,28,0.55);
    align-items:center;
    justify-content:center;
    z-index:3000;
  }




  .modal-overlay.show{ display:flex; }




  .modal-box{
    background:#DEDDDC;
    border-radius:8px;
    padding:36px 48px;
    text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,0.3);
    max-width:480px;
    width:90%;
  }




  .modal-box p{
    font-family:'Oswald', sans-serif;
    font-size:28px;
    font-weight:700;
    color:#536B5C;
    margin-bottom:24px;
    line-height:1.25;
  }




  .modal-confirm-btn{
    border:none;
    background:#5A7365;
    color:#fff;
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:10px 36px;
    border-radius:10px;
    cursor:pointer;
  }




  .clickable-row{ cursor:pointer; }
  .clickable-row:hover td{ background:#F6F3EB; }




  /* HELPER CLASSES PARANG WALA NANG INLINE STYLE WARNINGS */
  .text-loc { font-size: 12px; color: #666; }
  .text-section-title { font-size: 13px; font-weight: 700; margin-top: 6px; }
  .text-alert-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .text-narrative-title { font-size: 13px; font-weight: 700; margin: 16px 0 8px; }
  .textarea-narrative { width: 100%; height: 80px; border: 1.5px solid #666; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; resize: vertical; }




  .text-top-commodity { font-size: 13px; font-weight: 700; }
  .text-green-highlight { color: #0B823A; }
  .top-commodity-text { font-size: 12.5px; line-height: 1.6; }
  .text-as-of { font-size: 11px; color: #888; text-align: right; margin-top: 20px; }




  .upload-section { margin-top: 28px; border-top: 1px solid #EEE; padding-top: 16px; }
  .upload-title { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .upload-flex { display: flex; gap: 8px; }
  .input-required { flex: 1; padding: 6px 10px; font-size: 12px; border: 1px solid #CCC; border-radius: 4px; }
  .btn-select-file { padding: 6px 12px; font-size: 12px; }




  .actions-right-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  .btn-submit-bg { background: #E5E4E3; }




  .hidden-element { display: none; }
  .notes-row-clean { border-top: none; padding-top: 0; }
  .textarea-notes { width:100%; height:90px; padding:12px; font-size:14px; font-family:'Inter', sans-serif; border:1.5px solid #666; border-radius:4px; background:#fff; color:var(--ink); outline:none; resize:vertical; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>




<script>

  // ============================================================
  // SIDEBAR
  // ============================================================

  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const sidebar = document.getElementById("sidebar");

  if (hamburgerBtn && sidebar) {

    let hoverTimer = null;

    hamburgerBtn.addEventListener("mouseenter", function () {

      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }

      sidebar.classList.add("open");

      setTimeout(function () {
        if (window.leafletMap) {
          window.leafletMap.invalidateSize();
        }
      }, 300);

    });

    sidebar.addEventListener("mouseenter", function () {

      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }

    });

    sidebar.addEventListener("mouseleave", function () {

      hoverTimer = setTimeout(function () {
        sidebar.classList.remove("open");
      }, 200);

    });

    document.addEventListener("click", function (event) {

      const isInsideSidebar =
        sidebar.contains(event.target);

      const isHamburger =
        hamburgerBtn.contains(event.target);

      if (!isInsideSidebar && !isHamburger) {
        sidebar.classList.remove("open");
      }

    });

    sidebar.querySelectorAll(".nav-item").forEach(function (item) {

      item.addEventListener("click", function () {
        sidebar.classList.remove("open");
      });

    });

    document.addEventListener("keydown", function (event) {

      if (event.key === "Escape") {
        sidebar.classList.remove("open");
      }

    });

    const signoutBtn =
      sidebar.querySelector(".signout");

    if (signoutBtn) {

      signoutBtn.addEventListener("click", function () {
        sidebar.classList.remove("open");
      });

    }

  }


  // ============================================================
  // VIEW SWITCHING
  // ============================================================

  const navButtons =
    document.querySelectorAll(".nav-item[data-view]");

  const views =
    document.querySelectorAll(".view");


  function switchView(viewKey) {

    views.forEach(function (view) {
      view.classList.remove("active-view");
    });

    const targetView =
      document.getElementById("view-" + viewKey);

    if (targetView) {
      targetView.classList.add("active-view");
    }

    navButtons.forEach(function (btn) {
      btn.classList.toggle(
        "active",
        btn.dataset.view === viewKey
      );
    });

    if (
      viewKey === "map" &&
      window.leafletMap
    ) {

      setTimeout(function () {
        window.leafletMap.invalidateSize();
      }, 50);

    }

  }

// ============================================================

async function loadMunicipalityMapData(municipalityCoordinates) {
    try {
        const response = await fetch(
            `${API_BASE_URL}/api/planting-intents/municipality-map`,
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        console.log("Municipality Map Data:", result);

        if (!result.data || !Array.isArray(result.data)) {
            console.warn("No municipality map data found.");
            return;
        }

        result.data.forEach(municipalityData => {

            const municipality = municipalityData.municipality;
            const coordinates = municipalityCoordinates[municipality];

            if (!coordinates) {
                console.warn(
                    `No coordinates found for municipality: ${municipality}`
                );
                return;
            }

            let popupContent = `
                <div style="min-width: 180px;">
                    <strong>Municipality:</strong>
                    ${municipality}
                    <br><br>
            `;

            if (
                municipalityData.commodities &&
                Array.isArray(municipalityData.commodities)
            ) {
                municipalityData.commodities.forEach(item => {

                    popupContent += `
                        <strong>Commodity:</strong>
                        ${item.commodity}
                        <br>

                        <strong>Status:</strong>
                        ${item.status}
                        <br><br>
                    `;
                });
            }

            popupContent += `</div>`;

            L.marker(coordinates)
                .addTo(map)
                .bindPopup(popupContent);
        });

    } catch (error) {
        console.error(
            "Failed to load municipality map data:",
            error
        );
    }
}

// ============================================================

async function loadMunicipalReports() {




  if (!pendingReportsBody) {

  pendingReportsBody.innerHTML = `

// ============================================================

// ============================================================




function renderMunicipalReports(
  reports = municipalReports
) {




  if (!pendingReportsBody) {
    return;
  }




  pendingReportsBody.innerHTML = "";




  if (!reports || reports.length === 0) {




    pendingReportsBody.innerHTML = `

        <td colspan="6">

        </td>

  reports.forEach(report => {

      "clickable-row"
    );




    row.dataset.id =
      report.report_id;




    row.innerHTML = `




      <td>

          ${report.report_id ?? "—"}
        </span>
      </td>




      <td>
        <span class="pill">
          ${report.title || "Crop Harvest Report"}

      <td>

      <td>

        municipalReports.filter(report => {




          const reportId =
            String(

          const title =
            String(
              report.title ?? ""

          const commodity =
            String(

          const plantingDate =
            String(
              report.planting_date ?? ""
            ).toLowerCase();




          const yieldValue =
            String(
              report.estimated_yield ?? ""
            ).toLowerCase();




          return (

            title.includes(searchTerm) ||
            commodity.includes(searchTerm) ||
            plantingDate.includes(searchTerm) ||
            yieldValue.includes(searchTerm)
          );

      renderMunicipalReports(
        filteredReports

    }
  );




}








// ============================================================
// DATE FORMAT
// ============================================================




function formatDate(dateString) {




  if (!dateString) {
    return "—";
  }




  const date =
    new Date(dateString);




  if (isNaN(date.getTime())) {
    return dateString;
  }




  return date.toLocaleDateString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric"
    }
  );




}

    // ============================================================

    const validatorId = localStorage.getItem("user_id");
    const accessToken = localStorage.getItem("access_token");

      localStorage.getItem("token_type") || "bearer";


    const userRole = localStorage.getItem("role");


    console.log("Validator ID:", validatorId);

    console.log("Has Access Token:", !!accessToken);


    if (!validatorId) {
      throw new Error(
        "No logged-in user found. Please log in again."
      );
    }


    if (!accessToken) {
      throw new Error(
        "No access token found. Please log in again."
      );
    }


    // ============================================================
    // CHECK ROLE
    // ============================================================


    if (
      userRole !== "Municipal Coordinator" &&
      userRole !== "Municipal"
    ) {
      throw new Error(
        "Only a Municipal Coordinator can request revision."
      );
    }


    // ============================================================
    // REPORT DATA
    // ============================================================


    const reportId = selectedReport.report_id;


    const remarks =
      remarksTextarea.value.trim();


    if (!remarks) {
      throw new Error(
        "Revision remarks are required."
      );
    }


    // ============================================================
    // REQUEST REVISION API
    // ============================================================


    const revisionUrl =
      `${API_BASE_URL}/api/report-submissions/${reportId}/revision` +
      `?validator_id=${encodeURIComponent(validatorId)}` +
      `&validator_role=municipal_coordinator` +
      `&remarks=${encodeURIComponent(remarks)}`;


    console.log(
      "Revision URL:",
      revisionUrl
    );


    const response = await fetch(
      revisionUrl,
      {
        method: "POST",


        headers: {
          "Accept": "application/json",
          "Authorization":
            `${tokenType} ${accessToken}`
        }
      }
    );


    // ============================================================
    // HANDLE ERROR
    // ============================================================


    if (!response.ok) {


      const errorData =
        await response.json().catch(() => ({}));


      throw new Error(
        errorData.detail ||
        `Failed to request revision. Status: ${response.status}`
      );
    }


    // ============================================================
    // SUCCESS RESPONSE
    // ============================================================


    const result =
      await response.json();


    console.log(
      "Revision result:",
      result
    );


    // ============================================================
    // UPDATE LOCAL DATA
    // ============================================================


    selectedReport.status =
      "REVISION_REQUIRED";


    selectedReport.revision_remarks =
      remarks;


    // ============================================================
    // UPDATE BUTTON
    // ============================================================


    flagBtn.classList.add("active");
    flagBtn.textContent =
      "Flagged ✓";


    // ============================================================
    // UPDATE STATUS IN DETAIL VIEW
    // ============================================================


    const statusCell =
      document.querySelector(
        "#reportDetailBody td:last-child .status-pill"
      );


    if (statusCell) {


      statusCell.className =
        "status-pill pending";


      statusCell.textContent =
        "Revision Required";
    }


    // ============================================================
    // SUCCESS MODAL
    // ============================================================


    openModal(
      "Report Flagged for Revision"
    );


    // ============================================================
    // RELOAD REPORT LIST
    // ============================================================


    await loadMunicipalReports();


  } catch (error) {


    console.error(
      "Error requesting revision:",
      error
    );


    openModal(
      `Error: ${error.message}`
    );


    flagBtn.classList.remove("active");
    flagBtn.textContent =
      "Flag for Revision";


  } finally {


    flagBtn.disabled = false;


  }


});
